services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?Run npm run setup:env}
      MYSQL_USER: ${MYSQL_USER:?Run npm run setup:env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Run npm run setup:env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Run npm run setup:env}
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql --protocol=TCP -h 127.0.0.1 -u $$MYSQL_USER $$MYSQL_DATABASE -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
  mysql-test:
    image: mysql:8.4
    profiles: [test]
    environment:
      MYSQL_DATABASE: ${TEST_MYSQL_DATABASE:?Run npm run setup:env}
      MYSQL_USER: ${TEST_MYSQL_USER:?Run npm run setup:env}
      MYSQL_PASSWORD: ${TEST_MYSQL_PASSWORD:?Run npm run setup:env}
      MYSQL_ROOT_PASSWORD: ${TEST_MYSQL_ROOT_PASSWORD:?Run npm run setup:env}
    ports:
      - "127.0.0.1:${TEST_MYSQL_PORT:-3307}:3306"
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql --protocol=TCP -h 127.0.0.1 -u $$MYSQL_USER $$MYSQL_DATABASE -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
volumes:
  mysql_data:
